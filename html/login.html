<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Auralis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page centered-auth">

    <a href="home.html" class="site-logo">
        <img src="../banner/auralis.png" alt="Auralis logo" class="site-logo-img">
        <span>Auralis</span>
    </a>

    <main class="centered-auth-wrap">
        <div class="auth-card">

            <div class="auth-heading centered">
                <h2>Log in to Auralis</h2>
                <p>Continue your music journey.</p>
            </div>

            <div class="provider-buttons">
                <button type="button" class="provider-button" data-provider="google">
                    <span class="provider-icon google-icon">G</span>
                    <span>Continue with Google</span>
                </button>
            </div>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <form id="loginForm" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="loginPassword">Password</label>
                        <a href="#" id="forgotPassword" class="forgot-link">Forgot password?</a>
                    </div>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>

                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span class="custom-checkbox"></span>
                    <span>Remember me</span>
                </label>

                <button type="submit" class="auth-submit">
                    Log in
                    <span>→</span>
                </button>

                <p class="auth-message" id="loginMessage"></p>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </div>
    </main>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
